# File: sdks/python/pyproject.toml
# Purpose: Defines packaging metadata and the optional JSON-bridge command for the dependency-free Python SDK.
# Author: Raushan Raj

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qualyntra-sdk"
version = "1.0.0"
description = "Qualyntra Python SDK"
authors = [{name = "Raushan Raj"}]
requires-python = ">=3.11"

[project.scripts]
qualyntra-python-bridge = "qualyntra.bridge:main"
