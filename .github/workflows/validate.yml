# File: .github/workflows/validate.yml
# Purpose: Runs the complete Qualyntra polyglot validation gate for pull requests and main-branch changes.
# Author: Raushan Raj

name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Product Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Node dependencies
        run: npm ci

      - name: Run release validation
        run: npm run release:validate
