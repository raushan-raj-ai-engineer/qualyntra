# File: deploy/helm/qualyntra/templates/serviceaccount.yaml
# Purpose: Creates a workload identity boundary without automatically mounting Kubernetes API credentials into Qualyntra pods.
# Author: Raushan Raj
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qualyntra.serviceAccountName" . }}
  labels:
    {{- include "qualyntra.labels" . | nindent 4 }}
automountServiceAccountToken: false
