# File: deploy/helm/qualyntra/templates/dashboard.yaml
# Purpose: Deploys the Qualyntra dashboard BFF with probes, immutable filesystem, resources, and file-mounted server-side bootstrap credentials.
# Author: Raushan Raj
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-dashboard }
spec:
  replicas: {{ .Values.dashboard.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: dashboard } }
  template:
    metadata: { labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: dashboard } }
    spec:
      serviceAccountName: {{ include "qualyntra.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          env:
            - { name: QUALYNTRA_DASHBOARD_HOST, value: "0.0.0.0" }
            - { name: QUALYNTRA_DASHBOARD_PORT, value: "4320" }
            - { name: QUALYNTRA_DASHBOARD_CONTROL_PLANE_ORIGIN, value: "http://{{ .Release.Name }}-control-plane:{{ .Values.controlPlane.service.port }}" }
            - { name: QUALYNTRA_DASHBOARD_ALLOW_INSECURE_CONTROL_PLANE, value: "true" }
            - { name: QUALYNTRA_DASHBOARD_BOOTSTRAP_TOKEN_FILE, value: "/run/secrets/qualyntra/api-token" }
            - { name: QUALYNTRA_DASHBOARD_ORGANIZATION_ID, value: {{ .Values.global.organizationId | quote }} }
          ports: [{ name: http, containerPort: 4320 }]
          startupProbe: { httpGet: { path: /dashboard-health, port: http }, failureThreshold: 30, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /dashboard-health, port: http }, periodSeconds: 20, timeoutSeconds: 3 }
          readinessProbe: { httpGet: { path: /dashboard-health, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          resources: {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: bootstrap-secret, mountPath: /run/secrets/qualyntra/api-token, subPath: {{ .Values.controlPlane.bootstrapSecret.key }}, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: bootstrap-secret
          secret: { secretName: {{ .Values.controlPlane.bootstrapSecret.name | quote }} }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-dashboard }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: dashboard }
  ports: [{ name: http, port: {{ .Values.dashboard.service.port }}, targetPort: http }]
